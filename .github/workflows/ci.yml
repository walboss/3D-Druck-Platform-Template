name: CI

# Build und Tests fuer Frontend und API-Worker bei jedem Pull Request und
# Push (Review D27) — damit z. B. Dependabot-PRs nicht ungeprueft gemergt
# werden. Bewusst KEIN Deploy und keine Secrets: Frontend/Worker-Deploy
# laeuft weiter lokal ueber Claude Code (siehe CLAUDE.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (production)
        run: npx ng build --configuration production
      - name: Tests
        run: npx ng test --watch=false
      - name: CSP-Hash pruefen
        run: npm run check:csp

  api-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
