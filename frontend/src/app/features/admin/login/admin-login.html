@if (checkingSession()) {
  <div class="login-page">
    <i class="pi pi-spin pi-spinner"></i>
  </div>
} @else if (mfaStep()) {
  <div class="login-page">
    <div class="login-card">
      <h1>Bestätigungscode</h1>
      <p class="mfa-hint">Gib den 6-stelligen Code aus deiner Authenticator-App ein.</p>

      <form (ngSubmit)="verifyMfa()">
      <div class="form-field">
        <label for="mfaCode">Code</label>
        <input
          id="mfaCode"
          name="mfaCode"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          pInputText
          [(ngModel)]="mfaCode"
          autofocus
        />
      </div>

      @if (error()) {
        <p-message severity="error" styleClass="mb-2">{{ error() }}</p-message>
      }

      <p-button type="submit" label="Bestätigen" icon="pi pi-check" [loading]="loading()" styleClass="w-full" class="login-btn"></p-button>
      <p-button type="button" label="Abbrechen" severity="secondary" [text]="true" (click)="cancelMfa()" styleClass="w-full" class="login-btn"></p-button>
      </form>
    </div>
  </div>
} @else {
  <div class="login-page">
    <div class="login-card">
      <h1>Admin-Login</h1>

      <!-- Echtes Formular mit name/autocomplete, damit Passwortmanager funktionieren (Review C26). -->
      <form (ngSubmit)="loginWithPassword()">
      <div class="form-field">
        <label for="loginEmail">E-Mail</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" pInputText [(ngModel)]="email" />
      </div>
      <div class="form-field">
        <label for="loginPassword">Passwort</label>
        <p-password
          inputId="loginPassword"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          [feedback]="false"
          [toggleMask]="true"
        />
      </div>

      @if (error()) {
        <p-message severity="error" styleClass="mb-2">{{ error() }}</p-message>
      }

      <p-button type="submit" label="Anmelden" icon="pi pi-sign-in" [loading]="loading()" styleClass="w-full" class="login-btn"></p-button>
      </form>

      <div class="divider"><span>oder</span></div>

      <p-button severity="secondary" label="Mit Google anmelden" icon="pi pi-google" (click)="loginWithGoogle()" [outlined]="true" styleClass="w-full" class="login-btn"></p-button>
    </div>
  </div>
}
