<p-toast position="top-center" />
<div class="admin-shell" [class.menu-open]="menuOpen()">
  <header class="admin-topbar">
    <button type="button" class="menu-btn" (click)="toggleMenu()" aria-label="Menü öffnen">
      <i class="pi pi-bars"></i>
    </button>
    <span class="topbar-title">{{ currentTitle() }}</span>
  </header>

  <div class="admin-backdrop" (click)="closeMenu()"></div>

  <aside class="admin-sidebar">
    <div class="admin-brand">
      <span class="brand-logo-chip"><img src="/brand/logo.png" alt="Mein 3D-Druck" width="165" height="112" /></span>
      <span>Admin</span>
      <button type="button" class="close-btn" (click)="closeMenu()" aria-label="Menü schließen">
        <i class="pi pi-times"></i>
      </button>
    </div>
    <nav class="admin-nav">
      @for (group of navGroups; track group.title) {
        @if (group.title) {
          <div class="nav-group-title">{{ group.title }}</div>
        }
        @for (item of group.items; track item.path) {
          <a [routerLink]="item.path" class="nav-item" [class.active]="activePath() === item.path" (click)="closeMenu()">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
            @if (item.badge && badges()[item.badge] > 0) {
              <span class="nav-badge" [class.nav-badge-warn]="item.badge === 'lowStock'" [title]="badgeTitles[item.badge]">{{ badges()[item.badge] }}</span>
            }
          </a>
        }
      }
    </nav>
    <div class="sidebar-footer">
      <div class="footer-actions">
        <button type="button" class="footer-btn" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? 'Helles Design' : 'Dunkles Design'" [title]="theme() === 'dark' ? 'Helles Design' : 'Dunkles Design'">
          <i [class]="theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"></i>
        </button>
        <a routerLink="/" class="footer-btn" title="Zum Shop" aria-label="Zum Shop">
          <i class="pi pi-external-link"></i>
        </a>
        <button type="button" class="footer-btn footer-logout" (click)="logout()">
          <i class="pi pi-sign-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="admin-content">
    <router-outlet />
  </main>

  <app-scroll-top-button />
</div>
