<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Mein 3D-Druck</title>
  <!-- Link-Vorschau (WhatsApp & Co.); für /produkt/<id> ersetzt der Worker
       (worker/index.js) die Inhalte durch Name/Beschreibung/Bild. -->
  <meta name="description" content="3D-Drucke von Mein 3D-Druck">
  <meta property="og:site_name" content="Mein 3D-Druck">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mein 3D-Druck">
  <meta property="og:description" content="3D-Drucke von Mein 3D-Druck">
  <meta property="og:image" content="https://3d-druck-platform.DEINE-SUBDOMAIN.workers.dev/brand/logo.png">
  <meta property="og:url" content="https://3d-druck-platform.DEINE-SUBDOMAIN.workers.dev/">
  <meta name="twitter:card" content="summary_large_image">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('app-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
